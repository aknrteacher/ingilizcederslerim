  <body>
    <div id="root"></div>
    <script>
      // Set theme immediately based on URL path - runs BEFORE React loads
      (function() {
        'use strict';
        var path = window.location.pathname;
        var theme = 'default';
        
        // Determine theme from path (same logic as ThemeContext)
        if (path === '/' || path === '') {
          theme = 'default';
        } else if (path.includes('pre-school') || path.includes('okul-oncesi')) {
          theme = 'pre-school';
        } else if (path.includes('primary-school') || path.includes('grade-2') || path.includes('grade-1')) {
          theme = 'primary-school';
        } else if (path.includes('secondary-school')) {
          theme = 'secondary-school';
        } else if (path.includes('high-school')) {
          theme = 'high-school';
        } else if (path.includes('university')) {
          theme = 'university';
        } else if (path.includes('business-english')) {
          theme = 'business-english';
        }
        
        // Set data-theme attribute immediately (critical for CSS to work)
        var html = document.documentElement;
        html.setAttribute('data-theme', theme);
        
        // Force a reflow to ensure styles are applied (helps with older browsers)
        html.offsetHeight;
        
        // Also set body background class for theme backgrounds (fallback)
        var bodyClasses = {
          'pre-school': 'bg-amber-50',
          'primary-school': 'bg-blue-50',
          'secondary-school': 'bg-orange-50',
          'high-school': 'bg-green-50',
          'university': 'bg-purple-50',
          'business-english': 'bg-slate-50',
          'default': 'bg-white'
        };
        
        // Remove all theme classes first
        var allClasses = Object.values(bodyClasses);
        allClasses.forEach(function(cls) {
          document.body.classList.remove(cls);
        });
        
        // Add the current theme class
        if (bodyClasses[theme]) {
          document.body.classList.add(bodyClasses[theme]);
        }
        
        // Store theme for React to use later
        window.__initialTheme = theme;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Browser Compatibility Detection Script
      (function() {
        'use strict';
        
        // Detect CSS variable support
        function supportsCSSVariables() {
          try {
            return window.CSS && CSS.supports && CSS.supports('color', 'var(--test)');
          } catch (e) {
            return false;
          }
        }
        
        // Get browser information
        function getBrowserInfo() {
          var ua = navigator.userAgent;
          var browser = 'Unknown';
          var version = 'Unknown';
          var isOld = false;
          
          // Detect Internet Explorer
          if (ua.indexOf('MSIE') !== -1 || ua.indexOf('Trident/') !== -1) {
            browser = 'Internet Explorer';
            var match = ua.match(/(?:MSIE |rv:)(\d+(\.\d+)?)/);
            version = match ? match[1] : 'Unknown';
            isOld = parseFloat(version) < 11 || parseFloat(version) === 11;
          }
          // Detect Chrome
          else if (ua.indexOf('Chrome') !== -1 && ua.indexOf('Edg') === -1) {
            browser = 'Chrome';
            var match = ua.match(/Chrome\/(\d+)/);
            version = match ? match[1] : 'Unknown';
            isOld = parseInt(version) < 49;
          }
          // Detect Edge (Chromium)
          else if (ua.indexOf('Edg') !== -1) {
            browser = 'Edge (Chromium)';
            var match = ua.match(/Edg\/(\d+)/);
            version = match ? match[1] : 'Unknown';
            isOld = parseInt(version) < 15;
          }
          // Detect Edge (Legacy)
          else if (ua.indexOf('Edge') !== -1) {
            browser = 'Edge (Legacy)';
            var match = ua.match(/Edge\/(\d+)/);
            version = match ? match[1] : 'Unknown';
            isOld = parseInt(version) < 15;
          }
          // Detect Firefox
          else if (ua.indexOf('Firefox') !== -1) {
            browser = 'Firefox';
            var match = ua.match(/Firefox\/(\d+)/);
            version = match ? match[1] : 'Unknown';
            isOld = parseInt(version) < 31;
          }
          // Detect Safari
          else if (ua.indexOf('Safari') !== -1 && ua.indexOf('Chrome') === -1) {
            browser = 'Safari';
            var match = ua.match(/Version\/(\d+\.\d+)/);
            version = match ? match[1] : 'Unknown';
            isOld = parseFloat(version) < 9.1;
          }
          
          // Check if Chrome version needs fallback (49-119 range)
          var needsFallback = false;
          if (browser === 'Chrome') {
            var chromeVersion = parseInt(version);
            // Chrome 109 and similar versions might need fallback for some CSS features
            if (chromeVersion >= 49 && chromeVersion < 120) {
              needsFallback = true;
            }
          }
          
          return { browser: browser, version: version, isOld: isOld, needsFallback: needsFallback };
        }
        
        // Get OS information
        function getOSInfo() {
          var ua = navigator.userAgent;
          var os = 'Unknown';
          
          if (ua.indexOf('Windows') !== -1) {
            if (ua.indexOf('Windows NT 10.0') !== -1) os = 'Windows 10/11';
            else if (ua.indexOf('Windows NT 6.3') !== -1) os = 'Windows 8.1';
            else if (ua.indexOf('Windows NT 6.2') !== -1) os = 'Windows 8';
            else if (ua.indexOf('Windows NT 6.1') !== -1) os = 'Windows 7';
            else os = 'Windows';
          } else if (ua.indexOf('Mac') !== -1) {
            os = 'macOS';
          } else if (ua.indexOf('Linux') !== -1) {
            os = 'Linux';
          } else if (ua.indexOf('Android') !== -1) {
            os = 'Android';
          } else if (ua.indexOf('iOS') !== -1 || ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) {
            os = 'iOS';
          }
          
          return os;
        }
        
        // Check for other important features
        function getFeatureSupport() {
          return {
            cssVariables: supportsCSSVariables(),
            flexbox: CSS.supports('display', 'flex'),
            grid: CSS.supports('display', 'grid'),
            transform: CSS.supports('transform', 'translateX(0)'),
            localStorage: typeof(Storage) !== 'undefined',
            sessionStorage: typeof(sessionStorage) !== 'undefined'
          };
        }
        
        // Run detection
        var cssVarsSupported = supportsCSSVariables();
        var browserInfo = getBrowserInfo();
        var osInfo = getOSInfo();
        var features = getFeatureSupport();
        
        // Store compatibility info globally for debugging
        window.__browserCompatibility = {
          cssVariablesSupported: cssVarsSupported,
          browser: browserInfo.browser,
          browserVersion: browserInfo.version,
          isOldBrowser: browserInfo.isOld,
          needsFallback: browserInfo.needsFallback || false,
          os: osInfo,
          features: features,
          userAgent: navigator.userAgent,
          timestamp: new Date().toISOString()
        };
        
        // Apply fallback class if needed
        if (browserInfo.needsFallback || !cssVarsSupported) {
          document.documentElement.classList.add('browser-fallback');
          
          // Apply colors directly via inline styles for maximum compatibility
          var themeColors = {
            'pre-school': { bg: 'hsl(45, 60%, 97%)', sidebar: 'hsl(30, 30%, 20%)', sidebarFg: 'hsl(45, 100%, 97%)', sidebarPrimary: 'hsl(45, 100%, 75%)' },
            'primary-school': { bg: 'hsl(200, 60%, 97%)', sidebar: 'hsl(210, 30%, 12%)', sidebarFg: 'hsl(200, 60%, 90%)', sidebarPrimary: 'hsl(200, 100%, 75%)' },
            'secondary-school': { bg: 'hsl(25, 80%, 97%)', sidebar: 'hsl(20, 40%, 15%)', sidebarFg: 'hsl(25, 80%, 90%)', sidebarPrimary: 'hsl(25, 100%, 75%)' },
            'high-school': { bg: 'hsl(120, 50%, 97%)', sidebar: 'hsl(140, 30%, 12%)', sidebarFg: 'hsl(120, 50%, 90%)', sidebarPrimary: 'hsl(120, 80%, 70%)' },
            'university': { bg: 'hsl(270, 60%, 97%)', sidebar: 'hsl(260, 30%, 12%)', sidebarFg: 'hsl(270, 60%, 90%)', sidebarPrimary: 'hsl(270, 70%, 65%)' },
            'business-english': { bg: 'hsl(200, 10%, 97%)', sidebar: 'hsl(200, 15%, 15%)', sidebarFg: 'hsl(200, 10%, 90%)', sidebarPrimary: 'hsl(200, 20%, 65%)' },
            'default': { bg: 'hsl(0, 0%, 100%)', sidebar: 'hsl(0, 0%, 0%)', sidebarFg: 'hsl(0, 0%, 100%)', sidebarPrimary: 'hsl(0, 0%, 20%)' }
          };
          
          var currentTheme = window.__initialTheme || document.documentElement.getAttribute('data-theme') || 'default';
          var colors = themeColors[currentTheme] || themeColors['default'];
          
          // Apply background color directly to body
          if (colors && colors.bg) {
            document.body.style.backgroundColor = colors.bg;
          }
          
          // Store colors for later use
          window.__fallbackColors = colors;
        }
        
        // Log to console with styling
        console.log('%c🔍 Browser Compatibility Check', 'font-size: 16px; font-weight: bold; color: #2563eb;');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('Browser:', browserInfo.browser, browserInfo.version);
        console.log('OS:', osInfo);
        console.log('CSS Variables:', cssVarsSupported ? '✅ Supported' : '❌ Not Supported');
        console.log('Old Browser:', browserInfo.isOld ? '⚠️ Yes' : '✅ No');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('Feature Support:');
        console.log('  • Flexbox:', features.flexbox ? '✅' : '❌');
        console.log('  • CSS Grid:', features.grid ? '✅' : '❌');
        console.log('  • Transform:', features.transform ? '✅' : '❌');
        console.log('  • LocalStorage:', features.localStorage ? '✅' : '❌');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('Full Info:', window.__browserCompatibility);
        
        // Show visual warning if CSS variables not supported
        if (!cssVarsSupported) {
          var warning = document.createElement('div');
          warning.id = 'browser-compat-warning';
          warning.style.cssText = [
            'position: fixed',
            'top: 0',
            'left: 0',
            'right: 0',
            'background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%)',
            'color: white',
            'padding: 12px 20px',
            'text-align: center',
            'font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            'font-size: 14px',
            'font-weight: 600',
            'z-index: 99999',
            'box-shadow: 0 2px 8px rgba(0,0,0,0.2)',
            'border-bottom: 2px solid #b45309'
          ].join('; ');
          warning.innerHTML = '⚠️ You are using an older browser. Some features may not work perfectly. The site will use fallback colors.';
          document.body.insertBefore(warning, document.body.firstChild);
          
          // Auto-hide after 10 seconds
          setTimeout(function() {
            if (warning && warning.parentNode) {
              warning.style.transition = 'opacity 0.5s ease-out';
              warning.style.opacity = '0';
              setTimeout(function() {
                if (warning && warning.parentNode) {
                  warning.parentNode.removeChild(warning);
                }
              }, 500);
            }
          }, 10000);
        }
        
        // Log warning for old browsers even if CSS vars are supported
        if (browserInfo.isOld && cssVarsSupported) {
          console.warn('%c⚠️ Old Browser Detected', 'font-size: 14px; font-weight: bold; color: #f59e0b;');
          console.warn('Browser version may have compatibility issues. Consider updating.');
        }
        
        // Log info for browsers that need fallback
        if (browserInfo.needsFallback) {
          console.log('%cℹ️ Fallback Mode Enabled', 'font-size: 14px; font-weight: bold; color: #3b82f6;');
          console.log('Using enhanced compatibility mode for Chrome ' + browserInfo.version);
        }
      })();
    </script>
